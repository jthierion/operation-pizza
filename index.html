<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#171310" />
  <title>Choisis ton destin 🍕</title>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow">MISSION DU JOUR</div>
      <h1>Choisis ton destin 🍕</h1>
      <p class="subtitle">30 possibilités. Quelques décisions douteuses. Une seule pizza à l'arrivée.</p>
    </header>

    <section class="progress-card" aria-label="Progression">
      <div class="progress-top">
        <span id="stepLabel">Prête ?</span>
        <span id="stepCount">0 / 4</span>
      </div>
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      <div id="field" class="field" aria-label="Pizzas en lice"></div>
      <div id="scoreLegend" class="score-legend">Les 30 pizzas sont encore à égalité.</div>
    </section>

    <section id="game" class="card" aria-live="polite"></section>

    <footer>
      <button id="restartBtn" class="link-button" type="button" hidden>↻ Recommencer</button>
    </footer>
  </main>

  <script src="./assets/app.js"></script>
</body>
</html>
